name: Build DealZox Admin IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install xtool CLI
      run: |
        curl -fL "https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip" -o xtool.zip
        unzip -q xtool.zip
        sudo mv xtool.app/Contents/MacOS/xtool /usr/local/bin/xtool
        xtool --version

    - name: Build with xtool
      run: |
        xtool dev --xcode --configuration release || true

    - name: Package IPA
      run: |
        mkdir -p Payload/DealZoxAdmin.app
        if [ -d "./xtool/DealZoxAdmin.app" ]; then
          cp -R ./xtool/DealZoxAdmin.app/* Payload/DealZoxAdmin.app/
        fi
        cp Support/Info.plist Payload/DealZoxAdmin.app/
        zip -r DealZoxAdmin.ipa Payload
        ls -lh DealZoxAdmin.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DealZoxAdmin-iOS-IPA
        path: DealZoxAdmin.ipa
        retention-days: 7
